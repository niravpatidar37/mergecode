version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week so a compromised publish can be detected and yanked.
    cooldown:
      default-days: 7
    groups:
      # Minor/patch updates are batched. Major updates are NOT grouped: each one
      # arrives as its own PR so a breaking change cannot hold safe patches hostage
      # and each gets its own MergeCode verdict.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Types must match the oldest supported runtime (engines.node >= 22.12), or code
      # could compile against APIs that do not exist there. Bump with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
